name: ai-second-brain checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv && uv sync --all-extras --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen pytest -q
